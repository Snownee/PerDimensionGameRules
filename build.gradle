plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'eclipse'
    id "com.diffplug.eclipse.apt" version "4.1.0"
    id 'net.neoforged.moddev' version '2.0.107'
    id "me.shedaniel.unified-publishing" version "0.1.+"
}

version = "${minecraft_version}-NeoForge-${mod_version}"
group = "${mod_base_package}" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
//archivesBaseName = mod_name
var realVersion = mod_version + '+forge'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

neoForge {
    // We currently only support NeoForge versions later than 21.0.x
    // See https://projects.neoforged.net/neoforged/neoforge for the latest updates
    version = neoforge_version

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        mod_id {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        // Shedaniel's maven (Architectury API)
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // Shedaniel's maven (Architectury API)
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    //flatDir {
    //    dir 'libs'
    //}
    //maven {
    //    name = "jei"
    //    url = "https://dvs1.progwml6.com/files/maven"
    //}
    maven {
        url = "https://www.cursemaven.com"
    }

    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    implementation("maven.modrinth:kiwi:${project.kiwi_version}+neoforge")
    //annotationProcessor "curse.maven:kiwi-303657:4451128"
    implementation("me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}")
    implementation("dev.architectury:architectury-neoforge:${project.architectury_version}")
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")
}

processResources {
    from('src/main/java') {
        include '**/*.json'
    }
}

jar {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : mod_version,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    exclude '**/*.bat'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

unifiedPublishing {
    project {
        displayName = "[NeoForge $project.supported_version] $project.mod_version"
        version = project.mod_version // Optional, Inferred from project by default
        changelog = file("CHANGELOG.md").exists() ? file("CHANGELOG.md").text : "" // Optional, in markdown format
        releaseType = project.release_type // Optional, use "release", "beta" or "alpha"
        gameVersions = ["1.21.1"]
        gameLoaders = ["neoforge"]

        mainPublication tasks.jar // Declares the publicated jar

        if (System.getenv("CURSE_TOKEN") != null) {
            curseforge {
                token = System.getenv("CURSE_TOKEN")
                id = "828106"

                relations { // Optional, Inferred from the relations above by default
                    depends "kiwi"
                }
            }
        }

        if (System.getenv("MODRINTH_TOKEN") != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                id = "h5p7SvF3"

                relations { // Optional, Inferred from the relations above by default
                    depends "kiwi"
                }
            }
        }
    }
}
